<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ загруженности парковки ТЦ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .navbar-brand { font-weight: bold; letter-spacing: 0.5px; }
        .card { border: none; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .stat-value { font-size: 2.4rem; font-weight: 700; line-height: 1; }
        .stat-label { color: #6c757d; font-size: 0.9rem; }
        .result-img { width: 100%; border-radius: 10px; border: 1px solid #e3e6ec; }
        .dropzone { border: 2px dashed #adb5bd; border-radius: 12px; padding: 30px;
                    text-align: center; color: #6c757d; cursor: pointer; }
        .report-btn { border-radius: 10px; font-weight: 600; }
        .report-row { font-size: 0.85rem; }
        .badge-fmt { font-size: 0.7rem; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color:#1f6f43;">
        <div class="container">
            <span class="navbar-brand"><i class="fa-solid fa-square-parking me-2"></i>Анализ загруженности парковки ТЦ</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            <!-- Левая колонка: загрузка и результат -->
            <div class="col-lg-7">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fa-solid fa-upload me-2 text-success"></i>Загрузка изображения</h5>
                        <div class="dropzone" id="dropzone">
                            <i class="fa-solid fa-image fa-2x mb-2"></i>
                            <div>Выберите фото парковки для анализа</div>
                            <input type="file" id="imageInput" accept="image/*" hidden>
                        </div>
                        <button class="btn btn-success w-100 mt-3" onclick="processImage()">
                            <i class="fa-solid fa-play me-2"></i>Запустить обработку
                        </button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fa-solid fa-eye me-2 text-success"></i>Результат анализа</h5>
                        <img id="resultImage" class="result-img" src="result.jpg" alt="Результат">
                    </div>
                </div>
            </div>

            <!-- Правая колонка: статистика -->
            <div class="col-lg-5">
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <h5 class="mb-3 text-start"><i class="fa-solid fa-chart-pie me-2 text-success"></i>Текущая загруженность</h5>
                        <div class="row">
                            <div class="col-4">
                                <div class="stat-value text-dark" id="totalVal">8</div>
                                <div class="stat-label">Всего мест</div>
                            </div>
                            <div class="col-4">
                                <div class="stat-value text-danger" id="occVal">5</div>
                                <div class="stat-label">Занято</div>
                            </div>
                            <div class="col-4">
                                <div class="stat-value text-success" id="freeVal">3</div>
                                <div class="stat-label">Свободно</div>
                            </div>
                        </div>
                        <div class="progress mt-4" style="height: 22px;">
                            <div id="occBar" class="progress-bar bg-danger" style="width: 62%;">62%</div>
                        </div>
                        <div class="stat-label mt-2">Загруженность парковки</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fa-solid fa-clock me-2 text-success"></i>Загруженность по часам</h5>
                        <canvas id="hourlyChart" height="160"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок генерации отчётов -->
        <div class="row g-4 mt-1">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fa-solid fa-file-export me-2 text-success"></i>Генерация отчётов</h5>
                        <div class="row g-2 align-items-end mb-3">
                            <div class="col-sm-5">
                                <label class="stat-label">Период с</label>
                                <input type="date" id="dateFrom" class="form-control form-control-sm">
                            </div>
                            <div class="col-sm-5">
                                <label class="stat-label">по</label>
                                <input type="date" id="dateTo" class="form-control form-control-sm">
                            </div>
                            <div class="col-sm-2">
                                <button class="btn btn-outline-success btn-sm w-100" onclick="previewReport()">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-4">
                                <button class="btn btn-danger w-100 report-btn" onclick="downloadReport('pdf')">
                                    <i class="fa-solid fa-file-pdf me-2"></i>PDF
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-success w-100 report-btn" onclick="downloadReport('xlsx')">
                                    <i class="fa-solid fa-file-excel me-2"></i>Excel
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-secondary w-100 report-btn" onclick="downloadReport('csv')">
                                    <i class="fa-solid fa-file-csv me-2"></i>CSV
                                </button>
                            </div>
                        </div>
                        <div id="previewBox" class="mt-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="fa-solid fa-clock-rotate-left me-2 text-success"></i>Журнал отчётов</h5>
                        <table class="table table-sm align-middle mb-0">
                            <thead>
                                <tr class="report-row text-muted">
                                    <th>Формат</th><th>Период</th><th>Сформирован</th>
                                </tr>
                            </thead>
                            <tbody id="reportsBody" class="report-row"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const dropzone = document.getElementById('dropzone');
        const imageInput = document.getElementById('imageInput');
        dropzone.addEventListener('click', () => imageInput.click());

        async function processImage() {
            const file = imageInput.files[0];
            if (!file) { alert('Выберите изображение'); return; }
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch('/api/analyze?lot_id=1', { method: 'POST', body: formData });
            const data = await response.json();
            document.getElementById('resultImage').src = data.result_image + '?' + Date.now();
            document.getElementById('totalVal').innerText = data.total;
            document.getElementById('occVal').innerText = data.occupied;
            document.getElementById('freeVal').innerText = data.free;
            const bar = document.getElementById('occBar');
            bar.style.width = data.occupancy_pct + '%';
            bar.innerText = data.occupancy_pct + '%';
        }

        // ---------- Генерация отчётов ----------
        function periodParams() {
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            let params = 'lot_id=1';
            if (from) params += '&date_from=' + from;
            if (to) params += '&date_to=' + to;
            return params;
        }

        function downloadReport(fmt) {
            // Браузер сохраняет файл, сформированный серверным модулем report_generator
            window.location = '/api/report/' + fmt + '?' + periodParams();
            setTimeout(loadReports, 1200);
        }

        async function previewReport() {
            const box = document.getElementById('previewBox');
            const r = await fetch('/api/report/preview?' + periodParams());
            if (!r.ok) { box.innerHTML = '<div class="alert alert-warning py-2 mb-0">За выбранный период данных нет</div>'; return; }
            const d = await r.json();
            const s = d.summary;
            box.innerHTML = `<div class="alert alert-light border mb-0 report-row">
                <b>${d.lot.name}</b> · ${d.period.from} — ${d.period.to}<br>
                Замеров: <b>${s.measurements}</b> ·
                средняя загруженность: <b>${s.avg_load}%</b> ·
                максимум: <b>${s.max_load}%</b> ·
                в среднем свободно: <b>${s.avg_free}</b> мест</div>`;
        }

        async function loadReports() {
            const r = await fetch('/api/reports?lot_id=1');
            const rows = await r.json();
            const colors = { pdf: 'bg-danger', xlsx: 'bg-success', csv: 'bg-secondary' };
            document.getElementById('reportsBody').innerHTML = rows.slice(0, 6).map(x =>
                `<tr><td><span class="badge badge-fmt ${colors[x.report_type] || 'bg-dark'}">${x.report_type.toUpperCase()}</span></td>
                 <td>${x.period_from} — ${x.period_to}</td><td>${x.created_at}</td></tr>`).join('');
        }

        // График загруженности по часам
        async function loadChart() {
            const r = await fetch('/api/stats/hourly?lot_id=1');
            const rows = await r.json();
            new Chart(document.getElementById('hourlyChart'), {
                type: 'line',
                data: {
                    labels: rows.map(x => x.hour),
                    datasets: [{
                        label: 'Загруженность, %',
                        data: rows.map(x => x.avg_load),
                        borderColor: '#1f6f43',
                        backgroundColor: 'rgba(31,111,67,0.12)',
                        fill: true, tension: 0.35
                    }]
                },
                options: { plugins: { legend: { display: false } },
                           scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        loadChart();
        loadReports();
    </script>
</body>
</html>
